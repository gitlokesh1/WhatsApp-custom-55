<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d875a"><title>88Task • Available Tasks</title><link rel="stylesheet" href="/user-ui.css?v=20260908.3"></head><body><main class="u-content" data-user-page="tasks">
<header class="u-page-head"><div><div class="u-eyebrow">Verified earning tasks</div><h1>Available tasks</h1><p>Each successful task message earns your country’s current rate.</p></div><span id="rate" class="u-wallet-pill">Loading rate…</span></header><div id="alert"></div>
<section class="u-card"><div class="u-card-head"><div><h2>Choose a sending account</h2><p>Your connected WhatsApp account is used only for the task you confirm.</p></div><a class="u-btn small" href="/whatsapp">Manage accounts</a></div><select id="account" class="u-select"><option>Loading connected accounts…</option></select></section>
<section id="list" class="u-grid two" style="margin-top:18px"><article class="u-card"><div class="u-skeleton"></div></article></section>
</main><script src="/user-ui.js?v=20260908.3"></script><script>
let taskData=[];async function load(){try{const [p,t,w]=await Promise.all([uProfile(),uApi('/api/user/tasks'),uApi('/api/user/whatsapp')]);rate.textContent=uMoney(t.reward_per_message||p.reward_per_message,t.currency_code||p.currency_code)+' per message';const active=w.accounts.filter(x=>x.status==='active'&&x.connected);account.innerHTML=active.length?active.map(x=>'<option value="'+uEscape(x.id)+'">'+uEscape(x.phone)+' · Connected</option>').join(''):'<option value="">No connected account</option>';alert.innerHTML=t.earning_paused?'<div class="u-alert">'+uEscape(t.message)+'</div>':(!active.length?'<div class="u-alert">Connect a WhatsApp account before completing tasks.</div>':'');taskData=t.tasks||[];list.innerHTML=taskData.length?taskData.map(x=>'<article class="u-card u-task"><div class="u-card-head"><div><span class="u-badge">'+(x.country_code?uEscape(x.country_code)+' task':'Global task')+'</span><h2 style="margin-top:10px">'+uEscape(x.title)+'</h2></div><div class="u-reward">+'+uMoney(x.reward,x.currency_code)+'</div></div><div class="u-task-message">'+uEscape(x.message)+'</div><div class="u-row"><div class="u-row-main"><span>Verified recipient</span><strong>'+uEscape(x.target_phone.replace(/.(?=.{4})/g,'•'))+'</strong></div><button class="u-btn primary" data-claim="'+uEscape(x.id)+'" '+(!active.length?'disabled':'')+'>'+uIcon('send')+'Complete task</button></div></article>').join(''):uEmpty('flag','You are all caught up','New tasks will appear here when they become available.');list.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>claim(b))}catch(error){list.innerHTML=uEmpty('alert','Could not load tasks',error.message)}}
async function claim(button){if(!account.value)return uToast('Connect a WhatsApp account first','error');if(!confirm('Send this verified task message and earn the displayed reward?'))return;button.disabled=true;button.textContent='Sending…';try{const data=await uApi('/api/user/tasks/claim',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task_id:button.dataset.claim,whatsapp_account_id:account.value})});uCelebrate(data.reward,data.currency_code,data.gamification);await load()}catch(error){uToast(error.message,'error');button.disabled=false;button.textContent='Complete task'}}load();
</script></body></html>
