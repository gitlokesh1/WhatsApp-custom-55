<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d875a"><title>88Task • Available Tasks</title><link rel="stylesheet" href="/user-ui.css?v=20260909.8"></head><body><main class="u-content" data-user-page="tasks">
<header class="u-page-head"><div><div class="u-eyebrow">Verified earning tasks</div><h1>Available tasks</h1><p>Earn your local rate for every successful task.</p></div><span id="rate" class="u-wallet-pill">Loading rates…</span></header><div id="alert"></div>
<section id="accountCard" class="u-card"><div class="u-card-head"><div><h2>Choose a WhatsApp sending account</h2><p>This account is used only for WhatsApp tasks.</p></div><a class="u-btn small" href="/whatsapp">Manage accounts</a></div><select id="account" class="u-select"><option>Loading connected accounts…</option></select></section>
<section id="list" class="u-grid two" style="margin-top:18px"><article class="u-card"><div class="u-skeleton"></div></article></section>
</main><script src="/user-i18n.js?v=20260909.6"></script><script src="/user-ui.js?v=20260910.1"></script><script>
let taskData=[],activeAccounts=[],androidInstallation=null,smsBusy=false,smsClaimTimer=0,activeSMSClaimID='';
function androidBridge(){try{return window.AndroidSMS&&window.AndroidSMS.isAvailable()===true?window.AndroidSMS:null}catch(_){return null}}
function androidCanSend(){const bridge=androidBridge();try{return Boolean(bridge&&(!bridge.canSend||bridge.canSend()===true))}catch(_){return false}}
async function registerAndroid(){const bridge=androidBridge();if(!bridge)return null;try{const details=JSON.parse(bridge.getInstallation());await uApi('/api/user/android/installations',{method:'POST',body:details});setTimeout(()=>bridge.resumePending(),250);return details}catch(error){uToast(error.message||'Could not register Android SMS','error');return null}}
function renderTasks(){const hasAndroid=Boolean(androidInstallation&&androidBridge()),smsReady=hasAndroid&&androidCanSend()&&!smsBusy;list.innerHTML=taskData.length?taskData.map(x=>{const sms=x.channel==='sms',ready=sms?smsReady:activeAccounts.length>0,channel=sms?'SMS task':'WhatsApp task',action=sms?'Send SMS and earn':'Complete task';return '<article class="u-card u-task"><div class="u-card-head"><div><span class="u-badge">'+uEscape(uT(channel))+' · '+(x.country_code?uEscape(x.country_code)+' task':'Global task')+'</span><h2 style="margin-top:10px">'+uEscape(x.title)+'</h2></div><div class="u-reward">+'+uMoney(x.reward,x.currency_code)+'</div></div><div class="u-task-message">'+uEscape(x.message)+'</div><div class="u-row"><div class="u-row-main"><span>Verified recipient</span><strong>'+uEscape(x.target_phone.replace(/.(?=.{4})/g,'•'))+'</strong>'+(sms?'<small>'+uEscape(uT(hasAndroid?'Your carrier may charge for this SMS.':'Android app required for SMS tasks'))+'</small>':'')+'</div><button class="u-btn primary" data-claim="'+uEscape(x.id)+'" '+(!ready?'disabled':'')+'>'+uIcon(sms?'phone':'send')+uEscape(uT(action))+'</button></div></article>'}).join(''):uEmpty('flag','You are all caught up','New tasks will appear here when they become available.');list.querySelectorAll('[data-claim]').forEach(button=>button.onclick=()=>claim(button))}
async function load(){try{const [p,t,w]=await Promise.all([uProfile(),uApi('/api/user/tasks'),uApi('/api/user/whatsapp')]);rate.textContent=uMoney(t.reward_per_message||p.reward_per_message,t.currency_code||p.currency_code)+' WhatsApp · '+uMoney(t.sms_reward_per_message,t.currency_code||p.currency_code)+' SMS';activeAccounts=w.accounts.filter(x=>x.status==='active'&&x.connected);account.innerHTML=activeAccounts.length?activeAccounts.map(x=>'<option value="'+uEscape(x.id)+'">'+uEscape(x.phone)+' · Connected</option>').join(''):'<option value="">No connected account</option>';androidInstallation=await registerAndroid();const hasWhatsAppTasks=(t.tasks||[]).some(x=>x.channel!=='sms');const notices=[];if(t.earning_paused)notices.push(t.message);if(hasWhatsAppTasks&&!activeAccounts.length)notices.push('Connect a WhatsApp account before completing WhatsApp tasks.');if((t.tasks||[]).some(x=>x.channel==='sms')&&!androidInstallation)notices.push(uT('Open 88Task in the Android app to complete SMS tasks.'));alert.innerHTML=notices.map(message=>'<div class="u-alert">'+uEscape(message)+'</div>').join('');taskData=t.tasks||[];renderTasks()}catch(error){list.innerHTML=uEmpty('alert','Could not load tasks',error.message)}}
async function claim(button){const task=taskData.find(item=>item.id===button.dataset.claim);if(!task)return;if(task.channel==='sms')return claimSMS(button,task);if(!account.value)return uToast('Connect a WhatsApp account first','error');const reward=uMoney(task.reward,task.currency_code);if(!await uConfirm('Send this task message?','The verified message will be sent through your selected WhatsApp account. A successful send earns '+reward+'.',{confirmText:'Send and earn',icon:'send'}))return;button.disabled=true;button.textContent='Sending…';try{const data=await uApi('/api/user/tasks/claim',{method:'POST',body:{task_id:task.id,whatsapp_account_id:account.value}});uCelebrate(data.reward,data.currency_code,data.gamification);await load()}catch(error){uToast(error.message,'error');button.disabled=false;button.innerHTML=uIcon('send')+'Complete task'}}
async function claimSMS(button,task){if(smsBusy||!androidInstallation||!androidCanSend())return uToast('Finish the pending SMS task first','error');smsBusy=true;button.disabled=true;button.textContent='Preparing SMS…';try{const claim=await uApi('/api/user/tasks/sms/claim',{method:'POST',body:{task_id:task.id,installation_id:androidInstallation.installation_id}});activeSMSClaimID=claim.claim_id;androidBridge().sendTask(JSON.stringify(claim));button.textContent='Waiting for phone…';clearTimeout(smsClaimTimer);const delay=Math.max(0,new Date(claim.expires_at).getTime()-Date.now()),claimID=claim.claim_id;smsClaimTimer=setTimeout(async()=>{if(activeSMSClaimID!==claimID)return;activeSMSClaimID='';smsBusy=false;uToast('SMS claim expired. Start the task again.','error');await load()},delay)}catch(error){activeSMSClaimID='';smsBusy=false;uToast(error.message,'error');button.disabled=false;button.innerHTML=uIcon('phone')+uT('Send SMS and earn')}}
window.onAndroidSMSResult=async result=>{let payload=null,isActive=false,accepted=false;try{payload=typeof result==='string'?JSON.parse(result):result;isActive=payload?.claim_id===activeSMSClaimID;if(isActive){clearTimeout(smsClaimTimer);smsClaimTimer=0;activeSMSClaimID=''}const data=await uApi('/api/user/tasks/sms/result',{method:'POST',body:payload});androidBridge()?.acknowledgeResult(payload.claim_id);accepted=true;if(data.credited)uCelebrate(data.reward,data.currency_code,data.gamification);else uToast('SMS was not sent. No reward was credited.','error')}catch(error){if(payload?.claim_id&&[400,403,404,409,410,422].includes(error.status))androidBridge()?.acknowledgeResult(payload.claim_id);uToast(error.message||'Could not verify SMS result','error')}finally{if(isActive)smsBusy=false;if(accepted)await load();else renderTasks()}};
load();
</script></body></html>
