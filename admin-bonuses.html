<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>88Task • Bonus history</title><link rel="stylesheet" href="/admin-ui.css?v=20260909.5"></head><body><main data-admin-page="bonuses"><header class="admin-page-head"><div><div class="admin-eyebrow">Wallet operations</div><h1>Individual bonus history</h1><p>Auditable awards and reversals. New bonuses are awarded from a user workspace.</p></div><a class="admin-btn primary" href="/admin/users">Choose a user</a></header><article class="admin-card flush"><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Date</th><th>User</th><th>Description</th><th>Internal reason</th><th>Amount</th><th>State</th></tr></thead><tbody id="rows" data-admin-i18n-records><tr><td colspan="6"><div class="admin-empty">Loading…</div></td></tr></tbody></table></div></article></main><script src="/admin-ui.js?v=20260909.5"></script><script src="/admin-i18n.js?v=20260909.8"></script><script>
const money=(n,c)=>{try{return adminEscape(new Intl.NumberFormat(undefined,{style:'currency',currency:c||'INR'}).format(Number(n)||0))}catch(_){return adminEscape((c||'')+' '+Number(n||0).toFixed(2))}};async function load(){try{const d=await adminApi('/admin/bonuses/data'),items=d.bonuses||[];rows.innerHTML=items.length?items.map(x=>'<tr><td>'+adminEscape(adminFormatDate(x.created_at))+'</td><td><a href="/admin/user?id='+encodeURIComponent(x.user_db_id)+'">'+adminEscape(x.name)+'</a><div class="admin-help">'+adminEscape(x.user_id)+'</div></td><td>'+adminEscape(x.description)+'</td><td>'+adminEscape(x.internal_reason)+'</td><td><strong style="color:'+(x.direction==='debit'?'#b42318':'#087a50')+'">'+(x.direction==='debit'?'−':'+')+money(x.amount,x.currency_code)+'</strong></td><td>'+adminStatusBadge(x.reversed?'reversed':x.type==='bonus_reversal'?'completed':'active')+'</td></tr>').join(''):'<tr><td colspan="6"><div class="admin-empty">No individual bonuses yet.</div></td></tr>'}catch(error){showAdminError(error.message)}}document.addEventListener('DOMContentLoaded',()=>{if(!sessionStorage.getItem('admin_token'))return adminLogout();load()});
</script></body></html>
