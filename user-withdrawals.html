<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d875a"><title>88Task • Withdrawals</title><link rel="stylesheet" href="/user-ui.css?v=20260909.8"></head><body><main class="u-content" data-user-page="profile">
<header class="u-page-head"><div><div class="u-eyebrow">Secure payouts</div><h1>Withdraw funds</h1><p>Choose a local payout channel. Every request is reviewed.</p></div><a class="u-btn" href="/wallet">Wallet history</a></header><div id="notice"></div>
<section><article class="u-card"><div class="u-card-head"><div><h2>New request</h2><p>Preview the fee and net payout before submitting.</p></div></div><form id="form"><div class="u-field"><label for="channel">Payout channel</label><select id="channel" class="u-select" required></select></div><div id="instructions" class="u-help" style="margin-top:8px"></div><div class="u-field" style="margin-top:15px"><label for="amount">Amount</label><input id="amount" class="u-input" type="number" min="0.01" step="0.01" required></div><div id="beneficiary" class="u-form-grid" style="margin-top:15px"></div><div id="preview" class="u-country-lock" style="margin-top:15px">Select a channel and amount to preview fees.</div><button id="submitButton" class="u-btn primary block" type="submit" style="margin-top:18px">Request withdrawal</button></form></article></section>
<section class="u-card" style="margin-top:18px"><div class="u-card-head"><div><h2>Withdrawal history</h2><p>Gross amount, fees, net payout, and status.</p></div></div><div id="history"><div class="u-skeleton"></div></div></section>
</main><script src="/user-i18n.js?v=20260909.6"></script><script src="/user-ui.js?v=20260909.10"></script><script>
const history=document.getElementById('history');
let config,channels=[];const fieldKey=v=>String(v||'').replace(/[^a-z0-9_]/gi,'');function selected(){return channels.find(x=>x.id===channel.value)}function renderChannel(){const c=selected();beneficiary.innerHTML='';if(!c)return;instructions.textContent=c.instructions||'';amount.min=c.minimum;amount.max=c.maximum||'';let fields=c.fields;try{if(typeof fields==='string')fields=JSON.parse(fields)}catch(_){fields=[]}(fields||[]).forEach((f,index)=>{const key=String(f.key||''),safeKey=fieldKey(key);if(!key||!safeKey)return;const domID=safeKey+'_'+index,wrap=document.createElement('div');wrap.className='u-field full';wrap.innerHTML='<label for="beneficiary_'+uEscape(domID)+'">'+uEscape(f.label||key)+'</label><input id="beneficiary_'+uEscape(domID)+'" class="u-input" data-key="'+uEscape(key)+'" required autocomplete="off">';beneficiary.appendChild(wrap)});updatePreview()}function updatePreview(){const c=selected(),gross=Number(amount.value)||0;if(!c||!gross){preview.textContent='Select a channel and amount to preview fees.';return}const fee=c.fee_type==='percent'?gross*Number(c.fee_value)/100:Number(c.fee_value);preview.textContent='Requested '+uMoney(gross,c.currency_code)+' · Fee '+uMoney(fee,c.currency_code)+' · You receive '+uMoney(Math.max(0,gross-fee),c.currency_code)}async function load(){try{const [,c,h]=await Promise.all([uProfile(),uApi('/api/user/withdrawals/config'),uApi('/api/user/withdrawals')]);config=c;channels=c.channels||[];if(!c.enabled){notice.innerHTML='<div class="u-alert">'+(c.configured?'Withdrawals are not enabled for your account or country.':'Withdrawals are temporarily unavailable while secure gateway settings are completed.')+'</div>';form.querySelectorAll('input,select,button').forEach(x=>x.disabled=true)}channel.innerHTML='<option value="">Choose a payout channel</option>'+channels.map(x=>'<option value="'+uEscape(x.id)+'">'+uEscape(x.name)+' · '+uMoney(x.minimum,x.currency_code)+' minimum</option>').join('');renderHistory(h.withdrawals||[])}catch(error){notice.innerHTML='<div class="u-alert">'+uEscape(error.message)+'</div>'}}function renderHistory(items){history.innerHTML=items.length?items.map(x=>'<div class="u-row"><div class="u-row-main"><strong>'+uEscape(x.channel_name)+' · '+uEscape(x.status.replaceAll('_',' '))+'</strong><span>'+uDate(x.created_at)+' · Fee '+uMoney(x.fee_amount,x.currency_code)+' · Net '+uMoney(x.net_amount,x.currency_code)+'</span></div><strong>−'+uMoney(x.gross_amount,x.currency_code)+'</strong></div>').join(''):uEmpty('wallet','No withdrawals','Your payout requests will appear here.')}channel.onchange=renderChannel;amount.oninput=updatePreview;form.onsubmit=async e=>{e.preventDefault();const c=selected();if(!c)return;const data={};beneficiary.querySelectorAll('[data-key]').forEach(x=>data[x.dataset.key]=x.value.trim());if(!await uConfirm('Confirm withdrawal','Reserve '+uMoney(amount.value,c.currency_code)+' from your available balance?'))return;submitButton.disabled=true;try{await uApi('/api/user/withdrawals',{method:'POST',body:{channel_id:c.id,amount:Number(amount.value),beneficiary:data,idempotency_key:crypto.randomUUID()}});uToast('Withdrawal submitted for review');form.reset();renderChannel();load()}catch(error){uToast(error.message,'error')}finally{submitButton.disabled=false}};load();
</script></body></html>
