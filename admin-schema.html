<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>88Task • Public Schema</title><link rel="stylesheet" href="/admin-ui.css?v=20260907.5"></head><body>
<main data-admin-page="schema">
  <header class="admin-page-head"><div><div class="admin-eyebrow" data-i18n="schema.eyebrow">Advanced system tools</div><h1 data-i18n="schema.title">Public schema</h1><p data-i18n="schema.subtitle">Inspect and carefully manage rows in the PostgreSQL public schema.</p></div><button id="insertButton" class="admin-btn primary" type="button" data-i18n="schema.insert">Insert row</button></header>
  <div class="admin-alert warning" style="margin-bottom:18px"><div><strong data-i18n="schema.warning_title">Use with care</strong><span data-i18n="schema.warning">Changes made here update production database rows directly and may affect application behavior.</span></div></div>
  <article class="admin-card flush"><div style="padding:20px 20px 0"><div class="admin-toolbar"><div class="admin-field"><label for="tableSelect" data-i18n="schema.table">Table</label><select id="tableSelect" class="admin-select"><option data-i18n="common.loading">Loading…</option></select></div><div class="admin-field" style="flex:0 1 130px"><label for="rowLimit" data-i18n="schema.row_limit">Row limit</label><input id="rowLimit" class="admin-input" type="number" min="1" max="500" value="200"></div><button id="refreshButton" class="admin-btn" style="align-self:end" type="button" data-i18n="common.refresh">Refresh</button></div><div id="tableInfo" class="admin-help" style="margin-bottom:15px"></div></div><div id="schemaData" class="admin-table-wrap"><div class="admin-empty" data-i18n="schema.choose_table">Select a table to view rows.</div></div></article>
  <article id="editorCard" class="admin-card" style="display:none;margin-top:18px"><div class="admin-card-head"><div><h2 data-i18n="schema.edit_title">Edit row</h2><p id="editorIdentity"></p></div><button id="closeEditor" class="admin-btn small" type="button" data-i18n="common.close">Close</button></div><form id="editorForm"><div id="editorFields" class="admin-form-grid"></div><button id="saveRowButton" class="admin-btn primary" style="margin-top:15px" type="submit" data-i18n="common.save">Save</button></form></article>
</main>
<script src="/admin-ui.js?v=20260907.5"></script><script src="/admin-i18n.js?v=20260907.5"></script>
<script>
let schemaRows=[],schemaColumns=[],schemaIdentityColumns=[],editingWhere=null,editingRow=null,schemaTable='',schemaLoading=false,schemaLoadID=0;
const displayValue=value=>value===null?'':(typeof value==='object'?JSON.stringify(value):String(value));
async function initSchema(){try{const data=await adminApi('/admin/schema/data');const select=document.getElementById('tableSelect');select.innerHTML=(data.tables||[]).map(table=>`<option value="${adminEscape(table)}">${adminEscape(table)}</option>`).join('');if(data.tables?.length)loadTable();else document.getElementById('schemaData').innerHTML=`<div class="admin-empty">${adminEscape(adminT('schema.no_tables'))}</div>`}catch(error){showAdminError(error.message)}}
async function loadTable(){
  const table=document.getElementById('tableSelect').value;if(!table)return;
  const requestID=++schemaLoadID,button=document.getElementById('refreshButton'),insertButton=document.getElementById('insertButton');
  schemaLoading=true;schemaTable='';schemaRows=[];schemaColumns=[];schemaIdentityColumns=[];closeEditor();insertButton.disabled=true;
  document.getElementById('tableInfo').textContent='';document.getElementById('schemaData').innerHTML=`<div class="admin-empty">${adminEscape(adminT('common.loading'))}</div>`;
  adminSetBusy(button,true,adminT('common.refreshing'));
  try{
    const limit=Math.max(1,Math.min(500,Number(document.getElementById('rowLimit').value)||200));const data=await adminApi(`/admin/schema/data?table=${encodeURIComponent(table)}&limit=${limit}`);if(requestID!==schemaLoadID)return;
    schemaTable=data.table;schemaRows=data.rows||[];schemaColumns=data.columns||[];schemaIdentityColumns=data.identity_columns||[];insertButton.disabled=false;
    const identityLabel=schemaIdentityColumns.length?adminT('schema.identity_columns',{columns:schemaIdentityColumns.join(', ')}):adminT('schema.read_only');document.getElementById('tableInfo').innerHTML=`<strong>public.${adminEscape(data.table)}</strong> · ${adminEscape(adminT('schema.rows_shown',{count:schemaRows.length,limit:data.row_limit}))} · ${adminEscape(identityLabel)}<div class="admin-actions" style="margin-top:8px">${schemaColumns.map(column=>`<span class="admin-badge">${adminEscape(column.name)} · ${adminEscape(column.type)} · ${adminEscape(column.nullable)}</span>`).join('')}</div>`;document.getElementById('schemaData').innerHTML=schemaRows.length?`<table class="admin-table"><thead><tr>${schemaColumns.map(column=>`<th>${adminEscape(column.name)}</th>`).join('')}<th>${adminEscape(adminT('common.actions'))}</th></tr></thead><tbody>${schemaRows.map((row,index)=>`<tr>${schemaColumns.map(column=>`<td class="admin-cell-message" title="${adminEscape(displayValue(row[column.name]))}">${adminEscape(displayValue(row[column.name])||'—')}</td>`).join('')}<td><div class="admin-actions"><button class="admin-btn small" type="button" data-edit-row="${index}" ${schemaIdentityColumns.length?'':'disabled'}>${adminEscape(adminT('common.edit'))}</button><button class="admin-btn small danger" type="button" data-delete-row="${index}" ${schemaIdentityColumns.length?'':'disabled'}>${adminEscape(adminT('common.delete'))}</button></div></td></tr>`).join('')}</tbody></table>`:`<div class="admin-empty">${adminEscape(adminT('schema.no_rows'))}</div>`;
  }catch(error){if(requestID===schemaLoadID)document.getElementById('schemaData').innerHTML=`<div class="admin-empty"><strong>${adminEscape(adminT('common.load_failed'))}</strong>${adminEscape(error.message)}</div>`}finally{adminSetBusy(button,false);if(requestID===schemaLoadID){schemaLoading=false;insertButton.disabled=!schemaColumns.length}}
}
function identityFor(row){if(!schemaIdentityColumns.length)return null;const where={};for(const column of schemaIdentityColumns){if(row[column]===null||row[column]===undefined)return null;where[column]=row[column]}return where}
function editRow(index){
  const row=schemaRows[index],where=identityFor(row);if(!where)return showAdminError(adminT('schema.no_identity'));
  editingWhere=where;editingRow=row;
  document.getElementById('editorIdentity').textContent=adminT('schema.matched_by',{column:Object.keys(where).join(', ')});
  document.getElementById('editorFields').innerHTML=schemaColumns.map((column,i)=>{
    const locked=schemaIdentityColumns.includes(column.name)||(column.generated&&column.generated!=='NEVER')||Boolean(column.identity_generation),isNull=row[column.name]===null;
    return `<div class="admin-field"><label for="schemaField${i}">${adminEscape(column.name)}</label><input id="schemaField${i}" class="admin-input" data-column="${adminEscape(column.name)}" value="${adminEscape(displayValue(row[column.name]))}" ${locked?'disabled':''}><small>${adminEscape(column.type)} · ${adminEscape(column.nullable)}${locked?' · read-only':''}</small>${column.nullable==='YES'&&!locked?`<label class="admin-actions"><input type="checkbox" data-null-column="${adminEscape(column.name)}" ${isNull?'checked':''}> NULL</label>`:''}</div>`;
  }).join('');
  document.querySelectorAll('[data-null-column]').forEach(control=>{const input=document.querySelector(`[data-column="${CSS.escape(control.dataset.nullColumn)}"]`);const sync=()=>{input.disabled=control.checked};control.addEventListener('change',sync);sync()});
  document.getElementById('editorCard').style.display='block';document.getElementById('editorCard').scrollIntoView({behavior:'smooth',block:'start'});
}
function closeEditor(){editingWhere=null;editingRow=null;document.getElementById('editorCard').style.display='none';document.getElementById('editorFields').innerHTML=''}
async function saveRow(event){
  event.preventDefault();if(schemaLoading||!schemaTable||!editingWhere||!editingRow)return;
  const values={};
  for(const column of schemaColumns){
    const locked=schemaIdentityColumns.includes(column.name)||(column.generated&&column.generated!=='NEVER')||Boolean(column.identity_generation);if(locked)continue;
    const input=document.querySelector(`[data-column="${CSS.escape(column.name)}"]`),nullControl=document.querySelector(`[data-null-column="${CSS.escape(column.name)}"]`);
    const nextValue=nullControl?.checked?null:input.value,original=editingRow[column.name];
    const changed=nextValue===null?original!==null:(original===null||displayValue(original)!==nextValue);
    if(changed)values[column.name]=nextValue;
  }
  if(!Object.keys(values).length)return adminToast(adminT('schema.no_changes'));
  const table=schemaTable,button=document.getElementById('saveRowButton');adminSetBusy(button,true,adminT('common.saving'));try{await adminApi(`/admin/schema/write?table=${encodeURIComponent(table)}`,{method:'POST',body:JSON.stringify({where:editingWhere,values})});adminToast(adminT('schema.row_saved'));loadTable()}catch(error){showAdminError(error.message)}finally{adminSetBusy(button,false)}
}
async function insertRow(){if(schemaLoading||!schemaTable||!schemaColumns.length)return showAdminError(adminT('schema.choose_table'));const table=schemaTable,columns=[...schemaColumns],values={};for(const column of columns){const value=await showAdminPrompt(adminT('schema.value_prompt',{column:column.name}),'',adminT('schema.insert'),{placeholder:`${column.name} · ${column.type}`});if(value===null)break;if(value!=='')values[column.name]=value}if(!Object.keys(values).length||schemaLoading||table!==schemaTable)return;try{await adminApi(`/admin/schema/write?table=${encodeURIComponent(table)}`,{method:'POST',body:JSON.stringify({values})});adminToast(adminT('schema.row_inserted'));loadTable()}catch(error){showAdminError(error.message)}}
async function deleteRow(index){if(schemaLoading||!schemaTable)return;const table=schemaTable,row=schemaRows[index],where=identityFor(row);if(!where)return showAdminError(adminT('schema.no_identity'));const identity=Object.entries(where).map(([column,value])=>`${column} = ${displayValue(value)}`).join(', ');if(!await showAdminConfirm(adminT('schema.delete_confirm',{identity}),adminT('schema.delete_title'),{danger:true,confirmLabel:adminT('common.delete')}))return;if(schemaLoading||table!==schemaTable)return;try{await adminApi(`/admin/schema/delete?table=${encodeURIComponent(table)}`,{method:'POST',body:JSON.stringify({where})});adminToast(adminT('schema.row_deleted'));loadTable()}catch(error){showAdminError(error.message)}}
document.addEventListener('DOMContentLoaded',()=>{if(!sessionStorage.getItem('admin_token'))return adminLogout();document.getElementById('tableSelect').addEventListener('change',loadTable);document.getElementById('refreshButton').addEventListener('click',loadTable);document.getElementById('insertButton').addEventListener('click',insertRow);document.getElementById('closeEditor').addEventListener('click',closeEditor);document.getElementById('editorForm').addEventListener('submit',saveRow);document.getElementById('schemaData').addEventListener('click',event=>{const edit=event.target.closest('[data-edit-row]'),remove=event.target.closest('[data-delete-row]');if(edit)editRow(Number(edit.dataset.editRow));if(remove)deleteRow(Number(remove.dataset.deleteRow))});initSchema()});
</script></body></html>
