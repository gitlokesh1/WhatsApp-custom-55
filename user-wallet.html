<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d875a"><title>88Task • Wallet</title><link rel="stylesheet" href="/user-ui.css?v=20260909.2"></head>
<body><main class="u-content" data-user-page="wallet">
<header class="u-page-head"><div><div class="u-eyebrow">Your money</div><h1>Wallet</h1><p>Search and filter your complete debit and credit history.</p></div><div class="u-actions"><a class="u-btn" href="/profile">Back to profile</a><a class="u-btn primary" href="/withdrawals">Withdraw funds</a></div></header>
<section class="u-stat-grid" style="margin-bottom:18px"><article class="u-stat"><div class="u-stat-icon" data-u-icon="wallet"></div><div class="u-stat-label">Available balance</div><div id="walletBalance" class="u-stat-value">—</div></article><article class="u-stat"><div class="u-stat-icon" data-u-icon="activity"></div><div class="u-stat-label">Transactions shown</div><div id="shownCount" class="u-stat-value">0</div></article></section>
<article class="u-card lift"><div class="u-wallet-filters" aria-label="Wallet filters"><div class="u-field u-search-field"><label for="walletSearch">Search</label><input id="walletSearch" class="u-input" type="search" maxlength="120" placeholder="Description or transaction type"></div><div class="u-field"><label for="direction">Direction</label><select id="direction" class="u-select"><option value="">All</option><option value="credit">Credits</option><option value="debit">Debits</option></select></div><div class="u-field"><label for="transactionType">Type</label><select id="transactionType" class="u-select"><option value="">All types</option><option value="task_reward">Task reward</option><option value="referral_commission">Referral commission</option><option value="bonus">Bonus</option><option value="bonus_reversal">Bonus reversal</option><option value="admin_debit">Admin debit</option><option value="withdrawal_reserve">Withdrawal</option><option value="withdrawal_refund">Withdrawal refund</option></select></div><div class="u-field"><label for="transactionStatus">Status</label><select id="transactionStatus" class="u-select"><option value="">All statuses</option><option value="completed">Completed</option><option value="pending">Pending</option><option value="refunded">Refunded</option></select></div></div><div id="walletList"><div class="u-skeleton"></div></div><button id="loadMore" class="u-btn block" type="button" hidden style="margin-top:14px">Load more</button></article>
</main><script src="/user-ui.js?v=20260909.2"></script><script>let nextCursor='',items=[],requestNumber=0;function render(){shownCount.textContent=items.length;walletList.innerHTML=items.length?items.map(x=>'<div class="u-row"><div class="u-row-main"><strong>'+uEscape(x.description)+'</strong><span>'+uEscape((x.source_type||'transaction').replaceAll('_',' '))+' · '+uEscape(x.status)+' · '+uDate(x.created_at)+'</span></div><strong class="u-reward '+(x.direction==='debit'?'debit':'')+'">'+(x.direction==='debit'?'−':'+')+uMoney(x.amount,x.currency_code)+'</strong></div>').join(''):uEmpty('search','No matching transactions','Try changing your search or filters.');loadMore.hidden=!nextCursor}async function load(reset=true){const run=++requestNumber;if(reset){items=[];nextCursor='';walletList.innerHTML='<div class="u-skeleton"></div>'}const params=new URLSearchParams({limit:'50'});if(walletSearch.value.trim())params.set('q',walletSearch.value.trim());if(direction.value)params.set('direction',direction.value);if(transactionType.value)params.set('type',transactionType.value);if(transactionStatus.value)params.set('status',transactionStatus.value);if(!reset&&nextCursor)params.set('cursor',nextCursor);try{const data=await uApi('/api/user/wallet?'+params);if(run!==requestNumber)return;items.push(...(data.transactions||[]));nextCursor=data.next_cursor||'';render()}catch(error){if(run===requestNumber)walletList.innerHTML=uEmpty('alert','Could not load wallet',error.message)}}uProfile().then(p=>walletBalance.textContent=uMoney(p.balance,p.currency_code)).catch(error=>uToast(error.message,'error'));let debounce;walletSearch.oninput=()=>{clearTimeout(debounce);debounce=setTimeout(()=>load(),300)};[direction,transactionType,transactionStatus].forEach(control=>control.onchange=()=>load());loadMore.onclick=()=>load(false);load();</script></body></html>
