<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d875a"><title>88Task • Wallet</title><link rel="stylesheet" href="/user-ui.css?v=20260909.3"></head>
<body><main class="u-content" data-user-page="wallet">
<header class="u-page-head"><div><div class="u-eyebrow">Your money</div><h1>Wallet</h1><p>Search and filter your complete debit and credit history.</p></div><div class="u-actions"><a class="u-btn" href="/profile">Back to profile</a><a class="u-btn primary" href="/withdrawals">Withdraw funds</a></div></header>
<section class="u-stat-grid" style="margin-bottom:18px"><article class="u-stat"><div class="u-stat-icon" data-u-icon="wallet"></div><div class="u-stat-label">Available balance</div><div id="walletBalance" class="u-stat-value">—</div></article><article class="u-stat"><div class="u-stat-icon" data-u-icon="activity"></div><div class="u-stat-label">Transactions shown</div><div id="shownCount" class="u-stat-value">0</div></article></section>
<article class="u-card lift"><div class="u-wallet-filters" aria-label="Wallet filters"><div class="u-field u-search-field"><label for="walletSearch">Search</label><input id="walletSearch" class="u-input" type="search" maxlength="120" placeholder="Description or transaction type"></div><div class="u-field"><label for="direction">Direction</label><select id="direction" class="u-select"><option value="">All</option><option value="credit">Credits</option><option value="debit">Debits</option></select></div><div class="u-field"><label for="transactionType">Type</label><select id="transactionType" class="u-select"><option value="">All types</option><option value="task_reward">Task reward</option><option value="referral_commission">Referral commission</option><option value="bonus">Bonus</option><option value="bonus_reversal">Bonus reversal</option><option value="admin_debit">Admin debit</option><option value="withdrawal_reserve">Withdrawal</option><option value="withdrawal_refund">Withdrawal refund</option></select></div><div class="u-field"><label for="transactionStatus">Status</label><select id="transactionStatus" class="u-select"><option value="">All statuses</option><option value="completed">Completed</option><option value="pending">Pending</option><option value="refunded">Refunded</option></select></div></div><div id="walletList"><div class="u-skeleton"></div></div><button id="loadMore" class="u-btn block" type="button" hidden style="margin-top:14px">Load more</button></article>
</main><script src="/user-i18n.js?v=20260909.3"></script><script src="/user-ui.js?v=20260909.7"></script><script>
const walletList=document.getElementById('walletList'),loadMoreButton=document.getElementById('loadMore'),walletSearchInput=document.getElementById('walletSearch'),directionFilter=document.getElementById('direction'),typeFilter=document.getElementById('transactionType'),statusFilter=document.getElementById('transactionStatus'),shownCountElement=document.getElementById('shownCount'),walletBalanceElement=document.getElementById('walletBalance');
let nextCursor='',items=[],requestNumber=0,loadingMore=false;
function render(){shownCountElement.textContent=items.length;walletList.innerHTML=items.length?items.map(x=>'<div class="u-row"><div class="u-row-main"><strong>'+uEscape(x.description)+'</strong><span>'+uEscape((x.source_type||'transaction').replaceAll('_',' '))+' · '+uEscape(x.status)+' · '+uDate(x.created_at)+'</span></div><strong class="u-reward '+(x.direction==='debit'?'debit':'')+'">'+(x.direction==='debit'?'−':'+')+uMoney(x.amount,x.currency_code)+'</strong></div>').join(''):uEmpty('search','No matching transactions','Try changing your search or filters.');loadMoreButton.hidden=!nextCursor}
async function load(reset=true){if(!reset&&(!nextCursor||loadingMore))return;const run=++requestNumber,requestedCursor=reset?'':nextCursor;if(reset){items=[];nextCursor='';walletList.innerHTML='<div class="u-skeleton"></div>'}else{loadingMore=true;loadMoreButton.disabled=true;loadMoreButton.textContent='Loading…'}const params=new URLSearchParams({limit:'50'});if(walletSearchInput.value.trim())params.set('q',walletSearchInput.value.trim());if(directionFilter.value)params.set('direction',directionFilter.value);if(typeFilter.value)params.set('type',typeFilter.value);if(statusFilter.value)params.set('status',statusFilter.value);if(requestedCursor)params.set('cursor',requestedCursor);try{const data=await uApi('/api/user/wallet?'+params.toString());if(run!==requestNumber)return;const existing=new Set(items.map(item=>item.id)),incoming=(data.transactions||[]).filter(item=>item.id&&!existing.has(item.id));items=reset?data.transactions||[]:items.concat(incoming);const returnedCursor=data.next_cursor||'';nextCursor=returnedCursor&&returnedCursor!==requestedCursor?returnedCursor:'';render()}catch(error){if(run===requestNumber)walletList.innerHTML=uEmpty('alert','Could not load wallet',error.message)}finally{if(!reset){loadingMore=false;loadMoreButton.disabled=false;loadMoreButton.textContent='Load more'}}}
uProfile().then(p=>walletBalanceElement.textContent=uMoney(p.balance,p.currency_code)).catch(error=>uToast(error.message,'error'));let debounce;walletSearchInput.oninput=()=>{clearTimeout(debounce);debounce=setTimeout(()=>load(),300)};[directionFilter,typeFilter,statusFilter].forEach(control=>control.onchange=()=>load());loadMoreButton.onclick=()=>load(false);load();
</script></body></html>
