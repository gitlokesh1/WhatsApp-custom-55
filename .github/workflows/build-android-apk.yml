name: Build Android APKs

on:
  workflow_dispatch:
    inputs:
      portal_url:
        description: Deployed HTTPS portal origin, without a path
        required: true
        default: https://www.win777.sbs
        type: string
      build_type:
        description: Debug needs no secrets; release uses android-release environment secrets
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
      auto_version:
        description: Automatically increment versionCode and versionName for release builds
        required: true
        default: true
        type: boolean
      update_admin_panel:
        description: Automatically push new release link to the Admin Panel
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}-${{ inputs.build_type }}-${{ inputs.portal_url }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ inputs.build_type }} APKs
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: ${{ inputs.build_type == 'release' && 'android-release' || 'android-debug' }}
    env:
      PORTAL_URL: ${{ inputs.portal_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restrict release builds to the default branch
        if: inputs.build_type == 'release'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "Release builds can run only from the default branch." >&2
            exit 1
          fi

      - name: Determine and bump version
        id: versioning
        if: inputs.build_type == 'release'
        env:
          AUTO_VERSION: ${{ inputs.auto_version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          GRADLE_FILE="android/app/build.gradle.kts"
          CURRENT_CODE=$(grep -oE 'orElse\([0-9]+\)' "$GRADLE_FILE" | head -n1 | tr -dc '0-9')
          if [ -z "$CURRENT_CODE" ]; then
            CURRENT_CODE=$(grep -oE 'versionCode = [0-9]+' "$GRADLE_FILE" | head -n1 | awk '{print $3}' || echo "1")
          fi
          CURRENT_NAME=$(grep -oE 'orElse\("[^"]+"\)' "$GRADLE_FILE" | head -n1 | cut -d'"' -f2)
          if [ -z "$CURRENT_NAME" ]; then
            CURRENT_NAME=$(grep -oE 'versionName = "[^"]+"' "$GRADLE_FILE" | head -n1 | cut -d'"' -f2 || echo "1.0.0")
          fi

          if [ "$AUTO_VERSION" = "true" ]; then
            NEW_CODE=$((CURRENT_CODE + 1))
            BASE=$(echo "$CURRENT_NAME" | sed -E 's/\.[0-9]+$//')
            PATCH=$(echo "$CURRENT_NAME" | awk -F. '{print $NF}')
            if echo "$PATCH" | grep -qE '^[0-9]+$'; then
              NEW_PATCH=$((PATCH + 1))
              NEW_NAME="${BASE}.${NEW_PATCH}"
            else
              NEW_NAME="${CURRENT_NAME}.1"
            fi
            echo "Bumping version from $CURRENT_NAME ($CURRENT_CODE) to $NEW_NAME ($NEW_CODE)"

            sed -i -E "s/orElse\([0-9]+\)/orElse($NEW_CODE)/" "$GRADLE_FILE"
            sed -i -E "s/orElse\(\"[^\"]+\"\)/orElse(\"$NEW_NAME\")/" "$GRADLE_FILE"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore(release): bump version to $NEW_NAME ($NEW_CODE) [skip ci]" || echo "No file changes to commit"
            git push origin "HEAD:$DEFAULT_BRANCH" || echo "Version commit push skipped"
          else
            NEW_CODE=$CURRENT_CODE
            NEW_NAME=$CURRENT_NAME
          fi

          echo "version_code=$NEW_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$NEW_NAME" >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE=$NEW_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$NEW_NAME" >> "$GITHUB_ENV"

      - name: Configure release signing
        if: inputs.build_type == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Release builds require all four android-release environment secrets." >&2
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/88task-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"

      - name: Generate release changelog
        if: inputs.build_type == 'release'
        working-directory: android
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then RANGE="$LAST_TAG..HEAD"; else RANGE="HEAD~20..HEAD"; fi
          NOTES=$(git log $RANGE --pretty=format:"- %s" \
            | grep -v -E "^- (chore\(release\)|Merge pull request|ci\(|fix\(android\): open external)" \
            | head -12)
          if [ -z "$NOTES" ]; then NOTES="- Bug fixes and improvements"; fi
          printf "%s\n" "$NOTES" > ../../release_notes.txt
          echo "Changelog for this release:"; cat ../../release_notes.txt

      - name: Build debug APKs
        if: inputs.build_type == 'debug'
        working-directory: android
        run: ./gradlew assembleDebug "-PportalUrl=$PORTAL_URL" --no-daemon

      - name: Build release APKs
        if: inputs.build_type == 'release'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/88task-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            "-PportalUrl=$PORTAL_URL" \
            "-PversionCode=$VERSION_CODE" \
            "-PversionName=$VERSION_NAME" \
            -PenableSplits=true \
            --no-daemon

      - name: Build release AAB bundle
        if: inputs.build_type == 'release'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/88task-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            "-PportalUrl=$PORTAL_URL" \
            "-PversionCode=$VERSION_CODE" \
            "-PversionName=$VERSION_NAME" \
            -PenableSplits=false \
            --no-daemon

      - name: Prepare release distribution artifacts
        if: inputs.build_type == 'release'
        run: |
          mkdir -p dist
          APK_DIR="android/app/build/outputs/apk/release"
          BUNDLE_DIR="android/app/build/outputs/bundle/release"

          if [ -f "$APK_DIR/app-universal-release.apk" ]; then
            cp "$APK_DIR/app-universal-release.apk" "dist/88Task-v${VERSION_NAME}-universal.apk"
          fi
          if [ -f "$APK_DIR/app-arm64-v8a-release.apk" ]; then
            cp "$APK_DIR/app-arm64-v8a-release.apk" "dist/88Task-v${VERSION_NAME}-arm64.apk"
          fi
          if [ -f "$APK_DIR/app-armeabi-v7a-release.apk" ]; then
            cp "$APK_DIR/app-armeabi-v7a-release.apk" "dist/88Task-v${VERSION_NAME}-arm32.apk"
          fi
          if [ -f "$BUNDLE_DIR/app-release.aab" ]; then
            cp "$BUNDLE_DIR/app-release.aab" "dist/88Task-v${VERSION_NAME}.aab"
          fi

          cd dist
          sha256sum * > SHA256SUMS.txt
          cd ..

      - name: Publish GitHub Release
        if: inputs.build_type == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${VERSION_NAME}"
          TITLE="88Task v${VERSION_NAME} (Build ${VERSION_CODE})"
          {
            echo "### 88Task Android Release v${VERSION_NAME}"
            echo ""
            echo "- **Version Code**: \`${VERSION_CODE}\`"
            echo "- **Portal**: \`${PORTAL_URL}\`"
            echo "- **Universal APK**: [88Task-v${VERSION_NAME}-universal.apk](https://github.com/${{ github.repository }}/releases/download/${TAG}/88Task-v${VERSION_NAME}-universal.apk)"
            echo ""
            echo "### What's New"
            if [ -f ../../release_notes.txt ]; then cat ../../release_notes.txt; else echo "- Bug fixes and improvements"; fi
          } > release_body.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TITLE" --notes-file release_body.md
          fi

      - name: Update Admin Panel Version Settings
        if: inputs.build_type == 'release' && inputs.update_admin_panel
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "::warning ::ADMIN_TOKEN secret is not configured; skipping automatic admin panel update. Set ADMIN_TOKEN in GitHub repository secrets to enable automatic sync."
            exit 0
          fi

          UNIVERSAL_DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION_NAME}/88Task-v${VERSION_NAME}-universal.apk"
          UPDATE_MSG="A new version (v${VERSION_NAME}) is available. Please update to continue."

          if [ -f ../../release_notes.txt ]; then
            UPDATE_MSG="What's new in v${VERSION_NAME}:$(printf '\n'; cat ../../release_notes.txt)"
          fi

          PAYLOAD=$(jq -n \
            --arg code "$VERSION_CODE" \
            --arg name "$VERSION_NAME" \
            --arg url "$UNIVERSAL_DOWNLOAD_URL" \
            --arg msg "$UPDATE_MSG" \
            '{
              app_latest_version_code: $code,
              app_latest_version_name: $name,
              app_download_url: $url,
              app_update_message: $msg
            }')

          echo "Updating admin settings at $PORTAL_URL/admin/settings/data..."
          RESPONSE=$(curl -s -L --post301 --post302 --post303 -w "\nHTTP_STATUS:%{http_code}" -X POST "${PORTAL_URL}/admin/settings/data" \
            -H "Content-Type: application/json" \
            -H "X-Admin-Token: $ADMIN_TOKEN" \
            -d "$PAYLOAD")

          HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS")

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Successfully updated Admin Panel to version $VERSION_NAME ($VERSION_CODE) with download URL: $UNIVERSAL_DOWNLOAD_URL"
          else
            echo "::error ::Admin panel update returned HTTP $HTTP_CODE: $BODY"; exit 1
          fi

      - name: Create debug checksums
        if: inputs.build_type == 'debug'
        working-directory: android/app/build/outputs/apk/debug
        run: sha256sum *.apk > SHA256SUMS.txt

      - name: Upload artifacts for debugging/retention
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: 88Task-${{ inputs.build_type }}-build
          path: |
            android/app/build/outputs/apk/${{ inputs.build_type }}/*.apk
            android/app/build/outputs/bundle/${{ inputs.build_type }}/*.aab
          if-no-files-found: warn
          retention-days: 14
