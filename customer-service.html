<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d875a"><title>88Task • Customer Service</title><style>:root{--green:#087a50;--soft:#e8f8f1;--line:#e1e9e5;--text:#15211c;--muted:#66746e;--danger:#b5323c}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px clamp(18px,4vw,48px);background:#fff;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:900}.team{margin-left:53px;color:var(--muted);font-size:12px}.wrap{width:min(1120px,100%);margin:auto;padding:30px clamp(16px,4vw,40px)}h1{margin:0;font-size:clamp(28px,5vw,42px)}.intro{margin:4px 0 22px;color:var(--muted)}.filters{display:grid;grid-template-columns:1fr 190px auto;gap:10px;padding:16px;background:#fff;border:1px solid var(--line);border-radius:18px}.input{width:100%;padding:11px 13px;border:1px solid #d4dfd9;border-radius:11px;background:#fff}.btn{padding:10px 15px;border:0;border-radius:11px;background:var(--green);color:#fff;font-weight:800;cursor:pointer}.tickets{display:grid;gap:14px;margin-top:16px}.ticket{padding:20px;background:#fff;border:1px solid var(--line);border-radius:18px}.ticket-head{display:flex;justify-content:space-between;gap:14px}.meta{color:var(--muted);font-size:12px}.message{margin:15px 0;padding:13px;border-radius:12px;background:#f7f9f8;white-space:pre-wrap}.editor{display:grid;grid-template-columns:180px 1fr auto;gap:10px;align-items:end}.field{display:grid;gap:6px}.field label{font-size:11px;font-weight:800}.reply{min-height:76px;resize:vertical}.badge{padding:5px 9px;border-radius:99px;background:var(--soft);color:#05613f;font-size:11px;font-weight:800}.error{padding:16px;border-radius:13px;background:#fff0f1;color:var(--danger)}.empty{text-align:center;padding:45px;color:var(--muted)}@media(max-width:720px){.filters,.editor{grid-template-columns:1fr}.ticket-head{flex-direction:column}.btn{width:100%}}</style></head>
<body><header class="top"><div><div class="brand"><span class="company-logo-slot">88</span><span>88Task Customer Service</span></div><div id="team" class="team">Restricted country workspace</div></div><button id="forget" class="btn" type="button" style="background:#fff;color:var(--danger);border:1px solid #efcbd0">Leave panel</button></header><main class="wrap"><h1 id="heading">Customer tickets</h1><p class="intro">Review user issues, write a reply, and keep each ticket status current.</p><section class="filters"><input id="query" class="input" type="search" maxlength="120" placeholder="Search user ID, subject, or message"><select id="statusFilter" class="input"><option value="">All statuses</option><option value="open">Open</option><option value="in_progress">In progress</option><option value="resolved">Resolved</option><option value="closed">Closed</option></select><button id="refresh" class="btn" type="button">Refresh</button></section><div id="tickets" class="tickets"><div class="empty">Loading tickets…</div></div></main><script>
const key='88task_customer_service_token';let token=location.hash.slice(1)||sessionStorage.getItem(key)||'';if(location.hash){sessionStorage.setItem(key,token);history.replaceState(null,'',location.pathname)}const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=value=>value?new Date(value).toLocaleString():'—';async function api(options={}){const response=await fetch('/api/customer-service/tickets'+(options.query||''),{method:options.method||'GET',headers:{'Content-Type':'application/json','X-Customer-Service-Token':token},body:options.body?JSON.stringify(options.body):undefined});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.message||'Access failed');return data}function render(items){tickets.innerHTML=items.length?items.map(x=>'<article class="ticket"><div class="ticket-head"><div><strong>'+esc(x.subject)+'</strong><div class="meta">'+esc(x.user_name)+' · '+esc(x.user_id)+' · submitted '+esc(date(x.created_at))+'</div></div><span class="badge">'+esc(x.status.replaceAll('_',' '))+'</span></div><div class="message">'+esc(x.message)+'</div><div class="editor"><div class="field"><label>Status</label><select class="input" data-status="'+esc(x.id)+'"><option value="open">Open</option><option value="in_progress">In progress</option><option value="resolved">Resolved</option><option value="closed">Closed</option></select></div><div class="field"><label>Reply visible to customer</label><textarea class="input reply" maxlength="4000" data-reply="'+esc(x.id)+'" placeholder="Explain the resolution or next step.">'+esc(x.support_reply||'')+'</textarea></div><button class="btn" data-save="'+esc(x.id)+'" type="button">Save update</button></div></article>').join(''):'<div class="empty">No tickets match these filters.</div>';items.forEach(x=>{document.querySelector('[data-status="'+x.id+'"]').value=x.status});document.querySelectorAll('[data-save]').forEach(button=>button.onclick=()=>save(button.dataset.save,button))}async function load(){const params=new URLSearchParams;if(query.value.trim())params.set('q',query.value.trim());if(statusFilter.value)params.set('status',statusFilter.value);try{const search=params.toString();const data=await api({query:search?'?'+search:''});heading.textContent=data.country_name+' customer tickets';team.textContent=data.team_label+' · '+data.country_code+' only';render(data.tickets||[])}catch(error){tickets.innerHTML='<div class="error">'+esc(error.message)+'</div>'}}async function save(id,button){button.disabled=true;try{await api({method:'POST',body:{id,status:document.querySelector('[data-status="'+id+'"]').value,reply:document.querySelector('[data-reply="'+id+'"]').value.trim()}});button.textContent='Saved';setTimeout(()=>{button.textContent='Save update';load()},600)}catch(error){alert(error.message)}finally{button.disabled=false}}let debounce;query.oninput=()=>{clearTimeout(debounce);debounce=setTimeout(load,300)};statusFilter.onchange=load;refresh.onclick=load;forget.onclick=()=>{sessionStorage.removeItem(key);token='';location.reload()};if(!token)tickets.innerHTML='<div class="error">Open the complete link supplied by your administrator.</div>';else load();
</script></body></html>
