<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>88Task • Users</title><link rel="stylesheet" href="/admin-ui.css?v=20260909.3"></head><body><main data-admin-page="users">
<header class="admin-page-head"><div><div class="admin-eyebrow">Earning operations</div><h1>User management</h1><p>Inspect users by country, review earnings, and control account access.</p></div><button id="refreshButton" class="admin-btn">Refresh</button></header><section id="stats" class="admin-stats"></section>
<article class="admin-card flush"><div style="padding:20px 20px 0"><div class="admin-toolbar"><div class="admin-field"><label>Search</label><input id="query" class="admin-input" placeholder="User ID or name"></div><div class="admin-field"><label>Country</label><select id="countryFilter" class="admin-select"><option value="">All countries</option></select></div><div class="admin-field"><label>Status</label><select id="statusFilter" class="admin-select"><option value="">All statuses</option><option value="active">Active</option><option value="suspended">Suspended</option></select></div></div><div id="resultCount" class="admin-help" style="margin-bottom:14px"></div></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>User</th><th>Country</th><th>Balance</th><th>Total earning</th><th>Messages</th><th>Accounts</th><th>Status</th><th>Joined</th><th>Actions</th></tr></thead><tbody id="rows"><tr><td colspan="9"><div class="admin-empty">Loading…</div></td></tr></tbody></table></div></article>
<div class="admin-actions" style="justify-content:flex-end;margin-top:14px"><button id="previousPage" class="admin-btn" type="button">Previous</button><span id="pageLabel" class="admin-help">Page 1</span><button id="nextPage" class="admin-btn" type="button">Next</button></div></main><script src="/admin-ui.js?v=20260909.3"></script><script src="/admin-i18n.js?v=20260909.3"></script><script>
let users=[],countries=[],page=1,totalPages=1,loadSequence=0;const money=(n,c)=>{try{return new Intl.NumberFormat(undefined,{style:'currency',currency:c||'INR'}).format(Number(n)||0)}catch(_){return (c||'')+' '+Number(n||0).toFixed(2)}};async function loadCountries(){const d=await adminApi('/admin/countries/data');countries=d.countries||[];countryFilter.innerHTML='<option value="">All countries</option><option value="UNASSIGNED">Unassigned</option>'+countries.map(x=>'<option value="'+x.code+'">'+adminEscape(x.name)+'</option>').join('')}async function load(){const sequence=++loadSequence;try{const requestedPage=page;const params=new URLSearchParams({q:query.value,country:countryFilter.value,status:statusFilter.value,page:requestedPage,per_page:25});const d=await adminApi('/admin/users/data?'+params);if(sequence!==loadSequence)return;users=d.users||[];totalPages=Math.max(1,d.total_pages||1);stats.innerHTML=Object.entries(d.country_counts||{}).map(([code,count])=>'<article class="admin-stat"><div class="admin-stat-label">'+adminEscape(code)+'</div><div class="admin-stat-value">'+count+'</div><div class="admin-stat-meta">registered users</div></article>').join('');resultCount.textContent=(d.total||0)+' matching users';pageLabel.textContent='Page '+requestedPage+' of '+totalPages;previousPage.disabled=requestedPage<=1;nextPage.disabled=requestedPage>=totalPages;rows.innerHTML=users.length?users.map(x=>'<tr><td><div class="admin-cell-main">'+adminEscape(x.name)+'</div><div class="admin-help">'+adminEscape(x.user_id)+'</div></td><td>'+adminEscape(x.country_name||'Unassigned')+'</td><td>'+money(x.balance,x.currency_code)+'</td><td>'+money(x.total_earning,x.currency_code)+'</td><td class="numeric">'+x.successful_messages+'</td><td class="numeric">'+x.whatsapp_accounts+'</td><td>'+adminStatusBadge(x.status)+'</td><td>'+adminEscape(adminFormatDate(x.joined_at))+'</td><td><a class="admin-btn small primary" href="/admin/user?id='+encodeURIComponent(x.id)+'">Open workspace</a></td></tr>').join(''):'<tr><td colspan="9"><div class="admin-empty">No users match these filters.</div></td></tr>'}catch(error){if(sequence===loadSequence)showAdminError(error.message)}}let debounce;const resetLoad=()=>{page=1;load()};query.oninput=()=>{clearTimeout(debounce);debounce=setTimeout(resetLoad,250)};countryFilter.onchange=resetLoad;statusFilter.onchange=resetLoad;previousPage.onclick=()=>{if(page>1){page--;load()}};nextPage.onclick=()=>{if(page<totalPages){page++;load()}};refreshButton.onclick=load;document.addEventListener('DOMContentLoaded',async()=>{if(!sessionStorage.getItem('admin_token'))return adminLogout();await loadCountries();load()});
</script></body></html>
