<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087a50"><title>88Task • Advertiser login</title><link rel="stylesheet" href="/client-ui.css"></head><body><main class="client-login-page"><section class="client-login"><a class="client-brand" href="/client/login"><span class="client-mark">88</span><span>88Task Advertiser</span></a><h1>Client sign in</h1><p>Use the login ID and temporary password provided by our operations team.</p><form id="loginForm"><div class="client-field"><label for="loginID">Login ID</label><input id="loginID" class="client-input" autocomplete="username" required></div><div class="client-field"><label for="password">Password</label><input id="password" class="client-input" type="password" autocomplete="current-password" required></div><button id="loginButton" class="client-btn primary" type="submit" style="width:100%">Sign in</button><div id="message" aria-live="polite"></div></form></section></main><script src="/client-ui.js"></script><script>loginForm.onsubmit=async event=>{event.preventDefault();loginButton.disabled=true;message.innerHTML='';try{await clientApi('/api/client/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login_id:loginID.value.trim(),password:password.value})});location.href='/client'}catch(error){message.innerHTML='<div class="client-alert error">'+clientEscape(error.message)+'</div>'}finally{loginButton.disabled=false}};</script></body></html>
