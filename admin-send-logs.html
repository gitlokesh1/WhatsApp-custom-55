<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>88Task • Send Logs</title><link rel="stylesheet" href="/admin-ui.css?v=20260909.5"></head><body>
<main data-admin-page="logs">
  <header class="admin-page-head"><div><div class="admin-eyebrow" data-i18n="logs.eyebrow">Message history</div><h1 data-i18n="logs.title">Send logs</h1><p data-i18n="logs.subtitle">Inspect the latest 500 bulk-message attempts, assignments, outcomes, and errors.</p></div><button id="refreshButton" class="admin-btn" type="button" data-i18n="common.refresh">Refresh</button></header>
  <section class="admin-stats"><article class="admin-stat"><div class="admin-stat-label" data-i18n="common.total">Total</div><div id="total" class="admin-stat-value">—</div></article><article class="admin-stat"><div class="admin-stat-label" data-i18n="status.sent">Sent</div><div id="sent" class="admin-stat-value">—</div></article><article class="admin-stat danger"><div class="admin-stat-label" data-i18n="status.failed">Failed</div><div id="failed" class="admin-stat-value">—</div></article><article class="admin-stat warning"><div class="admin-stat-label" data-i18n="status.queued">Queued</div><div id="queued" class="admin-stat-value">—</div></article></section>
  <article class="admin-card flush"><div style="padding:20px 20px 0"><div class="admin-toolbar"><div class="admin-field"><label for="logSearch" data-i18n="common.search">Search</label><input id="logSearch" class="admin-input" data-i18n-placeholder="logs.search" placeholder="Search phone, error, sender, or message"></div><div class="admin-field" style="flex:0 1 190px"><label for="statusFilter" data-i18n="common.status">Status</label><select id="statusFilter" class="admin-select"><option value="" data-i18n="logs.all_statuses">All statuses</option><option value="queued" data-i18n="status.queued">Queued</option><option value="sending" data-i18n="status.sending">Sending</option><option value="sent" data-i18n="status.sent">Sent</option><option value="failed" data-i18n="status.failed">Failed</option><option value="paused" data-i18n="status.paused">Paused</option><option value="cancelled" data-i18n="status.cancelled">Cancelled</option></select></div></div><div id="resultCount" class="admin-help" style="margin-bottom:13px"></div></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>ID</th><th data-i18n="common.phone">Phone</th><th data-i18n="common.status">Status</th><th data-i18n="logs.attempts">Attempts</th><th data-i18n="logs.error">Last error</th><th data-i18n="logs.sender">Sender</th><th data-i18n="common.message">Message</th><th data-i18n="common.created">Created</th><th data-i18n="common.updated">Updated</th><th data-i18n="logs.sent_at">Sent at</th><th data-i18n="logs.campaign">Campaign</th></tr></thead><tbody id="logRows"><tr><td colspan="11"><div class="admin-empty" data-i18n="common.loading">Loading…</div></td></tr></tbody></table></div></article>
</main>
<script src="/admin-ui.js?v=20260909.5"></script><script src="/admin-i18n.js?v=20260909.8"></script>
<script>
let logData=[];
function renderLogs(){const query=document.getElementById('logSearch').value.toLowerCase(),status=document.getElementById('statusFilter').value;const rows=logData.filter(row=>(!status||row.status===status)&&(!query||[row.phone,row.last_error,row.assigned_sender,row.message,row.campaign_id].join(' ').toLowerCase().includes(query)));document.getElementById('total').textContent=logData.length;document.getElementById('sent').textContent=logData.filter(row=>row.status==='sent').length;document.getElementById('failed').textContent=logData.filter(row=>row.status==='failed').length;document.getElementById('queued').textContent=logData.filter(row=>row.status==='queued').length;document.getElementById('resultCount').textContent=adminT('logs.showing',{count:rows.length,total:logData.length});document.getElementById('logRows').innerHTML=rows.length?rows.map(row=>`<tr><td>${adminEscape(row.id)}</td><td><div class="admin-cell-main">${adminEscape(row.phone)}</div></td><td>${adminStatusBadge(row.status)}</td><td class="numeric">${adminEscape(row.attempts)}</td><td class="admin-cell-message">${adminEscape(row.last_error||'—')}</td><td>${adminEscape(row.assigned_sender||'—')}</td><td class="admin-cell-message">${adminEscape(row.message)}</td><td>${adminEscape(adminFormatDate(row.created_at))}</td><td>${adminEscape(adminFormatDate(row.updated_at))}</td><td>${adminEscape(adminFormatDate(row.sent_at))}</td><td>${adminEscape(row.campaign_id||'—')}</td></tr>`).join(''):`<tr><td colspan="11"><div class="admin-empty">${adminEscape(adminT('logs.empty'))}</div></td></tr>`}
async function loadLogs(){const button=document.getElementById('refreshButton');adminSetBusy(button,true,adminT('common.refreshing'));try{const data=await adminApi('/admin/send-logs/data');logData=data.rows||[];renderLogs()}catch(error){document.getElementById('logRows').innerHTML=`<tr><td colspan="11"><div class="admin-empty"><strong>${adminEscape(adminT('common.load_failed'))}</strong>${adminEscape(error.message)}</div></td></tr>`}finally{adminSetBusy(button,false)}}
document.addEventListener('DOMContentLoaded',()=>{if(!sessionStorage.getItem('admin_token'))return adminLogout();document.getElementById('refreshButton').addEventListener('click',loadLogs);document.getElementById('logSearch').addEventListener('input',renderLogs);document.getElementById('statusFilter').addEventListener('change',renderLogs);loadLogs();setInterval(loadLogs,10000)});
</script></body></html>
