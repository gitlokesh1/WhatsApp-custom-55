<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>88Task • Devices</title><link rel="stylesheet" href="/admin-ui.css?v=20260913.1"></head><body>
<main data-admin-page="devices">
  <header class="admin-page-head"><div><div class="admin-eyebrow" data-i18n="devices.eyebrow">WhatsApp infrastructure</div><h1 data-i18n="devices.title">Devices</h1><p data-i18n="devices.subtitle">Monitor every linked session and manage connection state from one place.</p></div><div class="admin-head-actions"><button id="refreshButton" class="admin-btn" type="button" data-i18n="common.refresh">Refresh</button><a class="admin-btn primary" href="/admin/pair" data-i18n="dashboard.pair_device">Pair a device</a></div></header>
  <section class="admin-stats">
    <article class="admin-stat"><div class="admin-stat-label" data-i18n="common.total">Total</div><div id="total" class="admin-stat-value">—</div></article>
    <article class="admin-stat"><div class="admin-stat-label" data-i18n="common.connected">Connected</div><div id="online" class="admin-stat-value">—</div></article>
    <article class="admin-stat warning"><div class="admin-stat-label" data-i18n="common.offline">Offline</div><div id="offline" class="admin-stat-value">—</div></article>
  </section>
  <section class="admin-card flush">
    <div style="padding:20px 20px 0"><div class="admin-toolbar"><div class="admin-field"><label class="admin-help" for="query" data-i18n="devices.search_label">Search accounts</label><input id="query" class="admin-input" data-i18n-placeholder="devices.search" placeholder="Search user ID or phone"></div></div></div>
    <div class="admin-table-wrap"><table class="admin-table"><thead><tr><th data-i18n="common.account">Account</th><th data-i18n="common.phone">Phone</th><th data-i18n="common.status">Status</th><th data-i18n="common.updated">Updated</th><th data-i18n="common.actions">Actions</th></tr></thead><tbody id="deviceRows"><tr><td colspan="5"><div class="admin-empty" data-i18n="common.loading">Loading…</div></td></tr></tbody></table></div>
  </section>
</main>
<script src="/admin-ui.js?v=20260913.1"></script><script src="/admin-i18n.js?v=20260909.8"></script>
<script>
let devices=[];
function renderDevices(){const q=document.getElementById('query').value.trim().toLowerCase();const rows=devices.filter(d=>`${d.user_id||''} ${d.phone||''}`.toLowerCase().includes(q));document.getElementById('total').textContent=devices.length;document.getElementById('online').textContent=devices.filter(d=>d.connected).length;document.getElementById('offline').textContent=devices.filter(d=>!d.connected).length;document.getElementById('deviceRows').innerHTML=rows.length?rows.map(d=>`<tr><td><div class="admin-cell-main">${adminEscape(d.user_id)}</div><div class="admin-cell-sub">${adminEscape(adminT('devices.session'))}</div></td><td>${adminEscape(d.phone||'—')}</td><td>${adminStatusBadge(d.state||(d.connected?'connected':'offline'))}</td><td>${adminEscape(adminFormatDate(d.updated_at))}</td><td><div class="admin-actions"><a class="admin-btn small" href="/admin/device?user_id=${encodeURIComponent(d.user_id)}">${adminEscape(adminT('common.manage'))}</a><button class="admin-btn small" data-action="reconnect" data-user="${adminEscape(d.user_id)}">${adminEscape(adminT('devices.reconnect'))}</button><button class="admin-btn small" data-action="send" data-user="${adminEscape(d.user_id)}">${adminEscape(adminT('devices.test_message'))}</button><button class="admin-btn small danger" data-action="logout" data-user="${adminEscape(d.user_id)}">${adminEscape(adminT('nav.logout'))}</button></div></td></tr>`).join(''):`<tr><td colspan="5"><div class="admin-empty"><strong>${adminEscape(adminT('devices.empty'))}</strong>${adminEscape(adminT('devices.empty_help'))}</div></td></tr>`;}
async function loadDevices(){const button=document.getElementById('refreshButton');adminSetBusy(button,true,adminT('common.refreshing'));try{const data=await adminApi('/admin/devices/data');devices=data.devices||[];renderDevices()}catch(error){document.getElementById('deviceRows').innerHTML=`<tr><td colspan="5"><div class="admin-empty"><strong>${adminEscape(adminT('common.load_failed'))}</strong>${adminEscape(error.message)}</div></td></tr>`}finally{adminSetBusy(button,false)}}
async function reconnect(device){try{await adminApi(`/admin/reconnect?user_id=${encodeURIComponent(device.user_id)}`,{method:'POST'});adminToast(adminT('devices.reconnect_requested'));loadDevices()}catch(error){showAdminError(error.message)}}
async function sendTest(device){const phone=await showAdminPrompt(adminT('devices.recipient_prompt'),device.phone||'',adminT('devices.test_message'),{placeholder:'919876543210',confirmLabel:adminT('common.next')});if(phone===null)return;const message=await showAdminPrompt(adminT('devices.message_prompt'),'88Task test message',adminT('devices.test_message'),{multiline:true,confirmLabel:adminT('common.send')});if(message===null||!message.trim())return;try{await adminApi(`/admin/test-send?user_id=${encodeURIComponent(device.user_id)}&phone=${encodeURIComponent(phone.trim())}&text=${encodeURIComponent(message.trim())}`);adminToast(adminT('devices.message_sent'));loadDevices()}catch(error){showAdminError(error.message)}}
async function logoutDevice(device){if(!await showAdminConfirm(adminT('devices.logout_confirm'),adminT('devices.logout_title'),{danger:true,confirmLabel:adminT('nav.logout')}))return;try{await adminApi(`/admin/logout?user_id=${encodeURIComponent(device.user_id)}`,{method:'POST'});adminToast(adminT('devices.logged_out'));loadDevices()}catch(error){showAdminError(error.message)}}
document.addEventListener('DOMContentLoaded',()=>{if(!sessionStorage.getItem('admin_token'))return adminLogout();document.getElementById('query').addEventListener('input',renderDevices);document.getElementById('refreshButton').addEventListener('click',loadDevices);document.getElementById('deviceRows').addEventListener('click',event=>{const button=event.target.closest('button[data-action]');if(!button)return;const device=devices.find(item=>item.user_id===button.dataset.user);if(!device)return;if(button.dataset.action==='reconnect')reconnect(device);if(button.dataset.action==='send')sendTest(device);if(button.dataset.action==='logout')logoutDevice(device)});loadDevices()});
</script></body></html>
