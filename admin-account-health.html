<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>88Task • Account Health</title><link rel="stylesheet" href="/admin-ui.css?v=20260913.1"></head><body>
<main data-admin-page="health">
  <header class="admin-page-head"><div><div class="admin-eyebrow" data-i18n="health.eyebrow">Risk monitoring</div><h1 data-i18n="health.title">Account health</h1><p data-i18n="health.subtitle">Monitor reachout restrictions and new-chat limits reported by WhatsApp.</p></div><button id="refreshAll" class="admin-btn" type="button" data-i18n="common.refresh">Refresh</button></header>
  <section id="healthSummary" class="admin-stats"><article class="admin-stat"><div class="admin-stat-label" data-i18n="health.monitored">Monitored</div><div id="monitored" class="admin-stat-value">—</div></article><article class="admin-stat"><div class="admin-stat-label" data-i18n="health.healthy">Healthy</div><div id="healthy" class="admin-stat-value">—</div></article><article class="admin-stat danger"><div class="admin-stat-label" data-i18n="health.restricted">Restricted</div><div id="restricted" class="admin-stat-value">—</div></article></section>
  <section id="healthCards" class="admin-grid two"><article class="admin-card"><div class="admin-skeleton"></div></article></section>
</main>
<script src="/admin-ui.js?v=20260913.1"></script><script src="/admin-i18n.js?v=20260909.8"></script>
<script>
let healthDevices=[];
function healthCard(device,health){const total=Number(health.cap_total||0),used=Number(health.cap_used||0),percent=total?Math.min(100,Math.round(used/total*100)):0;return `<article class="admin-card"><div class="admin-card-head"><div><h2>${adminEscape(device.phone||device.user_id)}</h2><p>${adminEscape(device.user_id)}</p></div>${adminStatusBadge(health.status||'unknown')}</div><div class="admin-kv"><div class="admin-kv-item"><div class="admin-kv-label">${adminEscape(adminT('health.timelock'))}</div><div class="admin-kv-value">${adminEscape(health.timelock_active?adminT('health.active'):adminT('health.clear'))}</div><div class="admin-cell-sub">${adminEscape(health.timelock_type||'—')} ${health.timelock_until?'• '+adminFormatDate(health.timelock_until):''}</div></div><div class="admin-kv-item"><div class="admin-kv-label">${adminEscape(adminT('health.new_chat_cap'))}</div><div class="admin-kv-value">${adminEscape(health.cap_status||adminT('status.unknown'))}</div><div class="admin-cell-sub">${used} / ${total||'—'} ${adminEscape(adminT('health.used'))}</div></div></div><div style="margin-top:13px" class="admin-progress"><span style="width:${percent}%"></span></div>${health.last_error?`<div class="admin-alert warning" style="margin-top:13px"><div><strong>${adminEscape(adminT('common.error'))}</strong>${adminEscape(health.last_error)}</div></div>`:''}<div class="admin-actions" style="margin-top:15px"><button class="admin-btn small" data-refresh-health="${adminEscape(device.user_id)}">${adminEscape(adminT('health.refresh_whatsapp'))}</button><span class="admin-help">${adminEscape(adminT('health.last_check'))}: ${adminEscape(adminFormatDate(health.last_checked_at))}</span></div></article>`}
async function loadHealth(){const button=document.getElementById('refreshAll');adminSetBusy(button,true,adminT('common.refreshing'));try{const data=await adminApi('/admin/devices/data');healthDevices=data.devices||[];const results=await Promise.allSettled(healthDevices.map(device=>adminApi(`/admin/account-health/data?user_id=${encodeURIComponent(device.user_id)}`)));const records=results.map((result,index)=>({device:healthDevices[index],health:result.status==='fulfilled'?result.value:{status:'unknown',last_error:result.reason?.message||adminT('common.unavailable')}}));document.getElementById('monitored').textContent=records.length;document.getElementById('healthy').textContent=records.filter(item=>item.health.status==='healthy').length;document.getElementById('restricted').textContent=records.filter(item=>item.health.timelock_active||String(item.health.cap_status).toLowerCase()==='capped').length;document.getElementById('healthCards').innerHTML=records.length?records.map(item=>healthCard(item.device,item.health)).join(''):`<article class="admin-card"><div class="admin-empty"><strong>${adminEscape(adminT('health.empty'))}</strong>${adminEscape(adminT('health.empty_help'))}</div></article>`}catch(error){document.getElementById('healthCards').innerHTML=`<article class="admin-card"><div class="admin-empty"><strong>${adminEscape(adminT('common.load_failed'))}</strong>${adminEscape(error.message)}</div></article>`}finally{adminSetBusy(button,false)}}
async function refreshHealth(userID,button){adminSetBusy(button,true,adminT('common.refreshing'));try{await adminApi(`/admin/account-health/refresh?user_id=${encodeURIComponent(userID)}`);adminToast(adminT('health.refreshed'));loadHealth()}catch(error){showAdminError(error.message)}finally{adminSetBusy(button,false)}}
document.addEventListener('DOMContentLoaded',()=>{if(!sessionStorage.getItem('admin_token'))return adminLogout();document.getElementById('refreshAll').addEventListener('click',loadHealth);document.getElementById('healthCards').addEventListener('click',event=>{const button=event.target.closest('[data-refresh-health]');if(button)refreshHealth(button.dataset.refreshHealth,button)});loadHealth()});
</script></body></html>
