<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>88Task • Device Details</title><link rel="stylesheet" href="/admin-ui.css?v=20260913.1"></head><body>
<main data-admin-page="devices">
  <header class="admin-page-head"><div><div class="admin-eyebrow" data-i18n="device.eyebrow">Device management</div><h1 data-i18n="device.title">Device details</h1><p data-i18n="device.subtitle">Inspect session state, reconnect the account, or send a controlled test message.</p></div><div class="admin-head-actions"><a class="admin-btn" href="/admin/devices" data-i18n="device.back">Back to devices</a><button id="refreshButton" class="admin-btn" type="button" data-i18n="common.refresh">Refresh</button></div></header>
  <div id="deviceContent" class="admin-grid two"><article class="admin-card"><div class="admin-skeleton"></div></article></div>
</main>
<script src="/admin-ui.js?v=20260913.1"></script><script src="/admin-i18n.js?v=20260909.8"></script>
<script>
const deviceUserID=new URLSearchParams(location.search).get('user_id');
async function loadDevice(){if(!deviceUserID){document.getElementById('deviceContent').innerHTML=`<article class="admin-card"><div class="admin-empty"><strong>${adminEscape(adminT('common.load_failed'))}</strong>${adminEscape(adminT('device.missing_user'))}<div style="margin-top:12px"><a class="admin-btn" href="/admin/devices">${adminEscape(adminT('nav.devices'))}</a></div></div></article>`;return}const button=document.getElementById('refreshButton');adminSetBusy(button,true,adminT('common.refreshing'));try{const d=await adminApi(`/admin/status?user_id=${encodeURIComponent(deviceUserID)}`);document.getElementById('deviceContent').innerHTML=`<article class="admin-card"><div class="admin-card-head"><div><h2>${adminEscape(d.user_id||deviceUserID)}</h2><p>${adminEscape(adminT('device.session_overview'))}</p></div>${adminStatusBadge(d.state||(d.connected?'connected':'offline'))}</div><div class="admin-kv"><div class="admin-kv-item"><div class="admin-kv-label">${adminEscape(adminT('common.account'))}</div><div class="admin-kv-value">${adminEscape(d.user_id||deviceUserID)}</div></div><div class="admin-kv-item"><div class="admin-kv-label">${adminEscape(adminT('common.connection'))}</div><div class="admin-kv-value">${adminEscape(d.connected?adminT('common.connected'):adminT('common.offline'))}</div></div><div class="admin-kv-item"><div class="admin-kv-label">${adminEscape(adminT('common.status'))}</div><div class="admin-kv-value">${adminEscape(d.state||'—')}</div></div><div class="admin-kv-item"><div class="admin-kv-label">${adminEscape(adminT('device.server_time'))}</div><div class="admin-kv-value">${adminEscape(adminFormatDate(d.server_time))}</div></div></div><div class="admin-section-title">${adminEscape(adminT('common.actions'))}</div><div class="admin-actions"><button class="admin-btn primary" type="button" onclick="reconnectDevice()">${adminEscape(adminT('devices.reconnect'))}</button><a class="admin-btn" href="/admin/account-health">${adminEscape(adminT('dashboard.check_health'))}</a><button class="admin-btn danger" type="button" onclick="logoutDevice()">${adminEscape(adminT('devices.logout_title'))}</button></div></article><article class="admin-card"><div class="admin-card-head"><div><h2>${adminEscape(adminT('device.send_title'))}</h2><p>${adminEscape(adminT('device.send_help'))}</p></div></div><form id="sendForm"><div class="admin-field"><label for="target">${adminEscape(adminT('device.recipient'))}</label><input id="target" class="admin-input" inputmode="numeric" placeholder="919876543210"></div><div class="admin-field" style="margin-top:14px"><label for="message">${adminEscape(adminT('common.message'))}</label><textarea id="message" class="admin-textarea" maxlength="4096"></textarea></div><button id="sendButton" class="admin-btn primary" style="margin-top:14px" type="submit">${adminEscape(adminT('common.send'))}</button></form></article>`;document.getElementById('sendForm').addEventListener('submit',sendMessage)}catch(error){document.getElementById('deviceContent').innerHTML=`<article class="admin-card"><div class="admin-empty"><strong>${adminEscape(adminT('common.load_failed'))}</strong>${adminEscape(error.message)}</div></article>`}finally{adminSetBusy(button,false)}}
async function reconnectDevice(){try{await adminApi(`/admin/reconnect?user_id=${encodeURIComponent(deviceUserID)}`,{method:'POST'});adminToast(adminT('devices.reconnect_requested'));loadDevice()}catch(error){showAdminError(error.message)}}
async function sendMessage(event){event.preventDefault();const target=document.getElementById('target').value.trim(),message=document.getElementById('message').value.trim();if(!target||!message)return showAdminError(adminT('device.required'));const button=document.getElementById('sendButton');adminSetBusy(button,true,adminT('common.sending'));try{await adminApi(`/admin/test-send?user_id=${encodeURIComponent(deviceUserID)}&phone=${encodeURIComponent(target)}&text=${encodeURIComponent(message)}`);document.getElementById('message').value='';adminToast(adminT('devices.message_sent'))}catch(error){showAdminError(error.message)}finally{adminSetBusy(button,false)}}
async function logoutDevice(){if(!await showAdminConfirm(adminT('devices.logout_confirm'),adminT('devices.logout_title'),{danger:true,confirmLabel:adminT('nav.logout')}))return;try{await adminApi(`/admin/logout?user_id=${encodeURIComponent(deviceUserID)}`,{method:'POST'});location.href='/admin/devices'}catch(error){showAdminError(error.message)}}
document.addEventListener('DOMContentLoaded',()=>{if(!sessionStorage.getItem('admin_token'))return adminLogout();document.getElementById('refreshButton').addEventListener('click',loadDevice);loadDevice()});
</script></body></html>
